<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Asignaciones para las reuniones</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #020617;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.2);
      --accent-strong: #facc15;
      --text: #f9fafb;
      --muted: #9ca3af;
      --border: rgba(148, 163, 184, 0.4);
      --radius-xl: 20px;
      --radius-md: 14px;
      --shadow-soft: 0 18px 45px rgba(15, 23, 42, 0.85);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

    body {
      min-height: 100vh;
      background: 
        radial-gradient(circle at top, rgba(56, 189, 248, 0.25), transparent 55%),
        linear-gradient(135deg, #020617, #0f172a);
      color: var(--text);
      padding: 1.5rem;
      display: flex;
      justify-content: center;
    }

    .page { width: 100%; max-width: 900px; }
    header { text-align: center; margin-bottom: 2rem; }
    header h1 { font-size: 2.5rem; font-weight: 700; color: #fff; text-shadow: 0 0 20px rgba(56, 189, 248, 0.3); }

    .pill-bar {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.4rem 1rem;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      margin-top: 1rem;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .pill-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 10px #22c55e; }

    .controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 2rem; }
    .btn-toggle { 
      padding: 0.5rem 1rem; border-radius: 999px; border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.6); color: var(--muted); cursor: pointer;
    }
    .btn-toggle.active { border-color: var(--accent); color: #fff; background: var(--accent-soft); }

    .card-shell {
      background: rgba(15, 23, 42, 0.4);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      padding: 1.5rem;
      box-shadow: var(--shadow-soft);
    }

    .assignments-grid { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }

    .assignment-card {
      background: rgba(2, 6, 23, 0.7);
      border-radius: var(--radius-md);
      border: 1px solid rgba(148, 163, 184, 0.3);
      padding: 1.2rem;
    }

    .date-header { 
      font-size: 1.4rem; font-weight: 800; color: var(--accent-strong); 
      margin-bottom: 1rem; border-bottom: 1px solid rgba(148, 163, 184, 0.2);
      padding-bottom: 0.5rem;
    }

    .roles-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }

    .role-item { display: flex; align-items: center; gap: 0.8rem; padding: 0.5rem; }
    .role-icon { font-size: 1.5rem; }
    .role-data { display: flex; flex-direction: column; }
    .role-name { font-size: 0.75rem; text-transform: uppercase; color: var(--muted); font-weight: 700; letter-spacing: 0.05em; }
    .person { font-size: 1.1rem; color: #fff; font-weight: 500; }

    /* Ajustes para Mayores */
    body.big-text .person { font-size: 1.4rem; }
    body.big-text .date-header { font-size: 1.6rem; }

    @media (max-width: 600px) {
      .roles-container { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <h1>Asignaciones Punta Gorda</h1>
      <div class="pill-bar">
        <span class="pill-dot"></span>
        <span>Sincronizado con Google Sheets</span>
      </div>
    </header>

    <div class="controls">
      <button class="btn-toggle" id="btn-text">Texto Grande</button>
      <button class="btn-toggle" id="btn-contrast">Alto Contraste</button>
    </div>

    <section class="card-shell">
      <div id="assignments" class="assignments-grid">Cargando asignaciones...</div>
    </section>
  </main>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/1v0ZUvpB5vE0_e8QL7ZdxXJOsrv6RTrIjBZcjRjdh44E/export?format=csv&gid=96081337";

    async function cargarDatos() {
      try {
        const res = await fetch(CSV_URL);
        const text = await res.text();
        const rows = text.split('\n').map(r => r.split(','));
        
        const data = rows.slice(1)
          .filter(r => r[0] && r[0].trim() !== "")
          .map(r => ({
            fecha: r[0], video: r[1], audio: r[2], mic1: r[3], mic2: r[4], plat: r[5], ent: r[6], aud: r[7]
          }));
        
        renderizar(data);
      } catch (e) {
        document.getElementById("assignments").innerHTML = "Error al conectar con la cartelera.";
      }
    }

    function renderizar(lista) {
      const contenedor = document.getElementById("assignments");
      contenedor.innerHTML = "";

      lista.forEach(f => {
        const card = document.createElement("div");
        card.className = "assignment-card";
        
        let rolesHTML = "";
        const roles = [
          {l: "Audio", v: f.audio, i: "🎧"}, {l: "Video", v: f.video, i: "📺"},
          {l: "Mic 1", v: f.mic1, i: "🎤"}, {l: "Mic 2", v: f.mic2, i: "🎤"},
          {l: "Plataforma", v: f.plat, i: "🛡️"}, {l: "Acomodador", v: f.ent, i: "🚪"}
        ];

        roles.forEach(r => {
          if (r.v && r.v.trim() !== "-" && r.v.trim() !== "") {
            rolesHTML += `
              <div class="role-item">
                <span class="role-icon">${r.i}</span>
                <div class="role-data">
                  <span class="role-name">${r.l}</span>
                  <span class="person">${r.v}</span>
                </div>
              </div>`;
          }
        });

        card.innerHTML = `<div class="date-header">${f.fecha}</div><div class="roles-container">${rolesHTML}</div>`;
        contenedor.appendChild(card);
      });
    }

    document.getElementById("btn-text").onclick = function() {
      document.body.classList.toggle("big-text");
      this.classList.toggle("active");
    };

    document.getElementById("btn-contrast").onclick = function() {
      document.body.style.filter = document.body.style.filter === "contrast(1.2) brightness(1.2)" ? "" : "contrast(1.2) brightness(1.2)";
      this.classList.toggle("active");
    };

    cargarDatos();
  </script>
</body>
</html>
