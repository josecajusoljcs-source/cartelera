<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Asignaciones para las reuniones</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #020617;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.2);
      --accent-strong: #facc15;
      --whatsapp: #25D366;
      --text: #f9fafb;
      --muted: #9ca3af;
      --border: rgba(148, 163, 184, 0.4);
      --radius-xl: 20px;
      --radius-md: 14px;
      --shadow-soft: 0 18px 45px rgba(15, 23, 42, 0.85);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, rgba(56, 189, 248, 0.25), transparent 55%), #020617;
      color: var(--text);
      padding: 1.5rem;
      display: flex;
      justify-content: center;
    }
    .page { width: 100%; max-width: 960px; }
    header { text-align: center; margin-bottom: 1.4rem; }
    header h1 { font-size: clamp(2.1rem, 5vw, 2.7rem); font-weight: 700; color: #f9fafb; }
    .pill-bar {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.5);
      margin-top: 0.7rem;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .pill-dot { width: 8px; height: 8px; border-radius: 999px; background: #22c55e; box-shadow: 0 0 12px rgba(34, 197, 94, 0.9); }
    .controls-bar { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .select-wrapper { width: 100%; max-width: 260px; }
    select {
      width: 100%; border-radius: 999px; padding: 0.5rem 1rem;
      border: 1px solid rgba(148, 163, 184, 0.7); background: rgba(15, 23, 42, 0.96); color: var(--text);
    }
    .view-tabs { display: inline-flex; border-radius: 999px; border: 1px solid rgba(148, 163, 184, 0.6); background: rgba(15, 23, 42, 0.9); overflow: hidden; }
    .view-tab { padding: 0.4rem 1rem; font-size: 0.8rem; color: var(--muted); border: none; background: transparent; cursor: pointer; }
    .view-tab.active { background: var(--accent-soft); color: #fff; }
    .card-shell {
      background: rgba(15, 23, 42, 0.5);
      border-radius: var(--radius-xl);
      border: 1px solid rgba(148, 163, 184, 0.35);
      padding: 1.5rem;
      box-shadow: var(--shadow-soft);
    }
    .assignments-grid { display: flex; flex-direction: column; gap: 1.5rem; }
    .assignment-card {
      background: rgba(15, 23, 42, 0.8);
      border-radius: var(--radius-md);
      border: 1px solid rgba(148, 163, 184, 0.5);
      padding: 1.2rem;
    }
    .assignment-day { font-size: 1.3rem; font-weight: 800; color: var(--accent-strong); margin-bottom: 1rem; border-bottom: 1px solid rgba(148, 163, 184, 0.2); padding-bottom: 0.5rem; }
    .role-row { display: flex; align-items: center; justify-content: space-between; padding: 0.7rem 0; border-bottom: 1px solid rgba(148, 163, 184, 0.1); }
    .role-info { display: flex; align-items: center; gap: 0.9rem; }
    .role-icon { font-size: 1.5rem; }
    .role-text { display: flex; flex-direction: column; }
    .role-label { font-size: 0.75rem; text-transform: uppercase; color: var(--muted); font-weight: bold; }
    .person-name { font-size: 1.1rem; color: #fff; font-weight: 500; }
    .btn-wa { background: var(--whatsapp); color: white; text-decoration: none; padding: 0.5rem 1rem; border-radius: 50px; font-size: 0.85rem; font-weight: bold; display: flex; align-items: center; gap: 0.4rem; }
    body.modo-texto-grande .person-name { font-size: 1.3rem; }
    body.modo-texto-grande .assignment-day { font-size: 1.5rem; }
    @media (max-width: 600px) {
      .role-row { flex-direction: column; align-items: flex-start; gap: 0.7rem; }
      .btn-wa { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <h1>Asignaciones Punta Gorda</h1>
      <div class="pill-bar"><span class="pill-dot"></span><span>Sincronizado con Google Sheets</span></div>
    </header>
    <div class="controls-bar">
      <div class="view-tabs">
        <button class="view-tab active" id="btn-mes">Todo el mes</button>
        <button class="view-tab" id="btn-hoy">Hoy</button>
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="view-tab" id="btn-texto-grande">Texto Grande</button>
        <button class="view-tab" id="btn-alto-contraste">Contraste+</button>
      </div>
    </div>
    <section class="card-shell">
      <div id="assignments" class="assignments-grid">Cargando datos...</div>
    </section>
  </main>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/1v0ZUvpB5vE0_e8QL7ZdxXJOsvr6RTrIjBZcjRjdh44E/export?format=csv&gid=96081337";
    const CONTACTS_URL = "https://docs.google.com/spreadsheets/d/1-ElfjMal3ULaiREBVqcjSZL_kBk_DOp5mzY-DnNcSkQ/export?format=csv&gid=0";

    let todasLasFilas = [];
    let contactos = {};

    async function cargar() {
      try {
        const resC = await fetch(CONTACTS_URL);
        const csvC = await resC.text();
        csvC.split('\n').forEach(line => {
          const cols = line.split(',');
          if(cols[0]) contactos[cols[0].trim().toLowerCase()] = cols[1] ? cols[1].replace(/\D/g,'') : '';
        });

        const res = await fetch(CSV_URL);
        const text = await res.text();
        const rows = text.split('\n').map(row => row.split(','));
        
        todasLasFilas = rows.slice(1).filter(r => r[0]).map(r => ({
          fecha: r[0], video: r[1], audio: r[2], mic1: r[3], mic2: r[4], plat: r[5], ent: r[6], aud: r[7]
        }));
        renderizar();
      } catch (e) {
        document.getElementById("assignments").innerHTML = "Error al conectar con la planilla.";
      }
    }

    function renderizar() {
      const contenedor = document.getElementById("assignments");
      contenedor.innerHTML = "";
      todasLasFilas.forEach(f => {
        const card = document.createElement("div");
        card.className = "assignment-card";
        card.innerHTML = `<div class="assignment-day">${f.fecha}</div>`;
        const roles = [
          {l: "Audio", v: f.audio, i: "🎧"}, {l: "Video", v: f.video, i: "📺"},
          {l: "Mic 1", v: f.mic1, i: "🎤"}, {l: "Mic 2", v: f.mic2, i: "🎤"},
          {l: "Plataforma", v: f.plat, i: "🛡️"}, {l: "Acomodador", v: f.ent, i: "🚪"}
        ];
        roles.forEach(r => {
          if(!r.v || r.v.trim() === "-" || r.v.trim() === "") return;
          const tel = contactos[r.v.trim().toLowerCase()];
          const waLink = tel ? `https://wa.me/${tel}?text=${encodeURIComponent("Hola " + r.v + " 😊. Te recordamos tu asignación de " + r.l + " para la reunión del " + f.fecha + ". ¡Gracias!")}` : null;
          const row = document.createElement("div");
          row.className = "role-row";
          row.innerHTML = `<div class="role-info"><span class="role-icon">${r.i}</span><div class="role-text"><span class="role-label">${r.l}</span><span class="person-name">${r.v}</span></div></div>${waLink ? `<a href="${waLink}" class="btn-wa">WhatsApp</a>` : ''}`;
          card.appendChild(row);
        });
        contenedor.appendChild(card);
      });
    }

    document.getElementById("btn-texto-grande").onclick = () => document.body.classList.toggle("modo-texto-grande");
    document.getElementById("btn-alto-contraste").onclick = () => {
      document.body.style.background = document.body.style.background === "black" ? "" : "black";
    };

    cargar();
  </script>
</body>
</html>
